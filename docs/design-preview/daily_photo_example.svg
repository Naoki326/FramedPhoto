<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">FramedPhoto 每日照片示意图</title>
  <desc id="desc">使用抽象风景示意每日照片功能：照片、拍摄日期和 AI 回忆文案叠加后显示在电子纸上。</desc>
  <rect width="1200" height="1600" fill="#ffffff"/>

  <!-- 抽象的公开安全风景图，不使用真人照片 -->
  <rect width="1200" height="1600" fill="#0050c8"/>
  <circle cx="850" cy="360" r="180" fill="#ff9c00"/>
  <path d="M0 960 L280 610 L500 850 L760 500 L1200 950 L1200 1600 L0 1600 Z" fill="#00963f"/>
  <path d="M0 1130 L300 820 L530 1030 L820 760 L1200 1120 L1200 1600 L0 1600 Z" fill="#ff9c00"/>
  <path d="M0 1320 Q260 1210 520 1320 T1200 1260 L1200 1600 L0 1600 Z" fill="#ffffff"/>
  <path d="M95 1020 Q145 975 195 1020 M145 975 L145 900" fill="none" stroke="#000000" stroke-width="18" stroke-linecap="round"/>
  <path d="M1020 880 Q1080 825 1140 880" fill="none" stroke="#000000" stroke-width="15" stroke-linecap="round"/>

  <!-- 信息衬底 -->
  <rect x="46" y="52" width="430" height="150" rx="22" fill="#16161a" opacity="0.94"/>
  <text x="82" y="112" fill="#ffffff" font-size="31" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">📷 每日精选</text>
  <text x="82" y="166" fill="#8dd4ff" font-size="25" font-family="SFMono-Regular, Menlo, monospace">2024.10.22</text>

  <rect x="50" y="1250" width="1100" height="290" rx="28" fill="#16161a" opacity="0.94"/>
  <text x="92" y="1330" fill="#ff9c00" font-size="30" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">历史上的今天</text>
  <text x="92" y="1415" fill="#ffffff" font-size="46" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">风从记忆里吹过来</text>
  <text x="92" y="1480" fill="#ffffff" font-size="27" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">AI 回忆文案 · Spectra 6 六色渲染</text>
</svg>
